[workspace]
members = [
    "h3",
    "h3-quinn",
    "h3-webtransport",
    "h3-datagram",

    # Internal
    "examples",
]
resolver = "2"

# h3-quinn reads with the quinn fork's public RecvStream::poll_read_chunk.
[patch.crates-io]
quinn = { git = "https://github.com/shirshak55/quinn", branch = "wiremason" }
quinn-proto = { git = "https://github.com/shirshak55/quinn", branch = "wiremason" }
quinn-udp = { git = "https://github.com/shirshak55/quinn", branch = "wiremason" }
